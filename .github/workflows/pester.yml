name: PowerShell tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/pester.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0
      - name: Run tests
        shell: pwsh
        run: Invoke-Pester ./tests -CI
